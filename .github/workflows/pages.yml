name: Pages

# Publishes the peer-to-peer build, which needs no server, on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # A deployment that has started runs to its end.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the site's address for the base path.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npx vite build --mode p2p --base "$BASE_PATH/" --outDir ../dist/pages
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Optional: a fork can relay through its own TURN servers.
          VITE_TURN_ICE_SERVERS: ${{ secrets.VITE_TURN_ICE_SERVERS }}
      # Pages knows no room paths, so it answers them with the app itself.
      - run: cp dist/pages/index.html dist/pages/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  # In the same job as the upload, deploy-pages sometimes cannot find the
  # artifact yet (actions/deploy-pages#451).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job, which runs no code from the repository, may publish.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
